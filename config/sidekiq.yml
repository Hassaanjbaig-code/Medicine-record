# config/sidekiq.yml

:scheduler:
  :schedule:
    hello_world:
      cron: "* * * * *"
      class: "HelloWorldSchedular"
      queue: "default"
    expire_date:
      cron: "* * * * *"
      class: "ExpireDateSchedular"
      queue: "default"
    appointment:
      cron: "* * * * *"
      class: "AppointmentSchedular"
      queue: "default"